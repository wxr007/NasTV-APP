name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 轻量检查：改了应用代码但没升版本号时给出 warning（不阻断出包）
  version-check:
    if: github.event_name == 'push'
    name: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump
        env:
          BEFORE: ${{ github.event.before }}
          FILE: client-android/version.properties
        run: |
          if [ -z "$BEFORE" ] || [ -z "$(echo "$BEFORE" | tr -d '0')" ]; then
            echo "首次推送该分支，跳过版本号检查" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::warning::找不到推送前的提交 $BEFORE（可能 force push 或历史被裁剪），跳过版本号检查"
            exit 0
          fi

          # 纯文档/工作流/脚本改动不要求升版本号
          APP_CHANGES=$(git diff --name-only "$BEFORE" HEAD \
            | grep -v -E '^(docs/|\.github/|.*\.(md|bat|sh|txt|properties)$|\.gitignore$|\.gitattributes$)' \
            | head -20 || true)
          if [ -z "$APP_CHANGES" ]; then
            echo "本次推送未改动应用代码，跳过版本号检查" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "本次改动的应用文件："
          echo "$APP_CHANGES"

          read_field() { git show "$1:$FILE" 2>/dev/null | sed -n "s/^[[:space:]]*$2[[:space:]]*=[[:space:]]*//p" | tr -d '\r' | head -1; }
          PREV_CODE=$(read_field "$BEFORE" versionCode)
          PREV_NAME=$(read_field "$BEFORE" versionName)
          CUR_CODE=$(read_field "HEAD" versionCode)
          CUR_NAME=$(read_field "HEAD" versionName)

          if [ -z "$PREV_CODE" ]; then
            echo "推送前没有版本文件，视为首次引入，跳过检查" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$CUR_CODE" ]; then
            echo "::error::$FILE 缺少 versionCode"
            exit 1
          fi

          if [ "$CUR_CODE" -le "$PREV_CODE" ]; then
            echo "::warning::版本号未升级：versionCode $PREV_CODE -> $CUR_CODE，versionName $PREV_NAME -> $CUR_NAME。改动应用代码后请同步 +1（见 client-android/version.properties）"
            {
              echo "### 版本号未升级"
              echo ""
              echo "| | 推送前 | 现在 |"
              echo "|---|---|---|"
              echo "| versionCode | $PREV_CODE | $CUR_CODE |"
              echo "| versionName | $PREV_NAME | $CUR_NAME |"
              echo ""
              echo "改动应用代码后请修改 \`client-android/version.properties\`（versionCode 必须 +1，否则设备无法覆盖安装）。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "版本号已升级：versionCode $PREV_CODE -> $CUR_CODE，versionName $PREV_NAME -> $CUR_NAME"
            {
              echo "### 版本号已升级：v$CUR_NAME（versionCode $CUR_CODE）"
              echo ""
              echo "| | 推送前 | 现在 |"
              echo "|---|---|---|"
              echo "| versionCode | $PREV_CODE | $CUR_CODE |"
              echo "| versionName | $PREV_NAME | $CUR_NAME |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: build-${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # release 使用 debug 签名（见 app/build.gradle.kts），无需额外 secrets
          - variant: release
            task: assembleRelease
          - variant: debug
            task: assembleDebug
    steps:
      - uses: actions/checkout@v4

      # 版本号唯一来源：client-android/version.properties（与 Gradle 共用）
      - name: Read version
        id: ver
        run: |
          PROPS=client-android/version.properties
          NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*//p' "$PROPS" | tr -d '\r' | head -1)
          CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*//p' "$PROPS" | tr -d '\r' | head -1)
          echo "name=${NAME:-1.0}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE:-1}" >> "$GITHUB_OUTPUT"
          echo "版本号：v${NAME:-1.0} (versionCode=${CODE:-1})"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它默认执行 `sdkmanager tools`，
      # 该包已从 SDK 仓库移除，会导致步骤直接失败。这里直接用 runner 预装的 SDK。
      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK_ROOT"
          SDKM=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -path '*/bin/*' 2>/dev/null | sort | head -1)
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "sdkmanager: $SDKM"
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 没有配置 Secrets 时自动回退 debug 签名，不会失败
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，release 将回退为 debug 签名"
            exit 0
          fi
          mkdir -p client-android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > client-android/keystore/release.jks
          printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
            > client-android/keystore.properties
          echo "已写入 release 签名配置（alias=${KEY_ALIAS}）"

      - name: Build (${{ matrix.variant }})
        working-directory: client-android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace ${{ matrix.task }}

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC="client-android/app/build/outputs/apk/dist/${{ matrix.variant }}"
          if compgen -G "$SRC/*.apk" > /dev/null; then
            cp "$SRC"/*.apk dist/
          else
            # 兜底：Gradle 的改名任务没跑成时，这里按同样规则补上版本号
            echo "::warning::$SRC 为空，回退到原始产物并手动加版本号"
            for f in client-android/app/build/outputs/apk/${{ matrix.variant }}/*.apk; do
              [ -e "$f" ] || continue
              cp "$f" "dist/$(basename "$f" | sed "s/^app-/NasTV-v${{ steps.ver.outputs.name }}-/")"
            done
          fi
          echo "产物清单："
          ls -lh dist

      # 仅作诊断，失败不阻断出包
      - name: Verify APK signature
        if: matrix.variant == 'release'
        continue-on-error: true
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$SDK_ROOT/build-tools/34.0.0/apksigner"
          if [ ! -f "$APKSIGNER" ]; then
            APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          fi
          echo "apksigner: ${APKSIGNER:-<not found>}"
          if [ -z "$APKSIGNER" ] || [ ! -f "$APKSIGNER" ]; then
            echo "::warning::未找到 apksigner，跳过签名校验"
            exit 0
          fi
          chmod +x "$APKSIGNER" || true
          for f in dist/*.apk; do
            echo "----- $f"
            "$APKSIGNER" verify --print-certs "$f" || echo "::warning::$f 校验未通过"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nastv-v${{ steps.ver.outputs.name }}-${{ matrix.variant }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: rm -f client-android/keystore.properties client-android/keystore/release.jks

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          PROPS=client-android/version.properties
          NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*//p' "$PROPS" | tr -d '\r' | head -1)
          CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*//p' "$PROPS" | tr -d '\r' | head -1)
          echo "name=${NAME:-1.0}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE:-1}" >> "$GITHUB_OUTPUT"
          if [ "v${NAME:-1.0}" != "${{ github.ref_name }}" ]; then
            echo "::warning::tag ${{ github.ref_name }} 与 version.properties 的 v${NAME:-1.0} 不一致，请确认是否忘了改版本号"
          fi

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: nastv-v${{ steps.ver.outputs.name }}-release
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh dist
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
                 --title "NasTV v${{ steps.ver.outputs.name }}" \
                 --notes "版本：v${{ steps.ver.outputs.name }}（versionCode ${{ steps.ver.outputs.code }}）

          Android APK，按 ABI 分包：arm64-v8a（主流手机）/ armeabi-v7a（旧设备）/ x86_64（模拟器）。所有版本由同一密钥签名，可直接覆盖升级。"
          gh release upload "$TAG" dist/*.apk -R "$GITHUB_REPOSITORY" --clobber
