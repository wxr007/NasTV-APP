name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # release 使用 debug 签名（见 app/build.gradle.kts），无需额外 secrets
          - variant: release
            task: assembleRelease
          - variant: debug
            task: assembleDebug
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它默认执行 `sdkmanager tools`，
      # 该包已从 SDK 仓库移除，会导致步骤直接失败。这里直接用 runner 预装的 SDK。
      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK_ROOT"
          SDKM=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -path '*/bin/*' 2>/dev/null | sort | head -1)
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "sdkmanager: $SDKM"
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (${{ matrix.variant }})
        working-directory: client-android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace ${{ matrix.task }}

      - name: Collect APK
        run: |
          mkdir -p dist
          find client-android/app/build/outputs/apk/${{ matrix.variant }} -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nastv-apk-${{ matrix.variant }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: nastv-apk-release
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh dist
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
                 --title "NasTV $TAG" \
                 --notes "Android APK，按 ABI 分包：arm64-v8a（主流手机）/ armeabi-v7a（旧设备）/ x86_64（模拟器）。使用 debug 签名，安装时可能提示未知来源。"
          gh release upload "$TAG" dist/*.apk -R "$GITHUB_REPOSITORY" --clobber
