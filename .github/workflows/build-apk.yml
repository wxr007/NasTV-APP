name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # release 使用 debug 签名（见 app/build.gradle.kts），无需额外 secrets
          - variant: release
            task: assembleRelease
          - variant: debug
            task: assembleDebug
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它默认执行 `sdkmanager tools`，
      # 该包已从 SDK 仓库移除，会导致步骤直接失败。这里直接用 runner 预装的 SDK。
      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK_ROOT"
          SDKM=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -path '*/bin/*' 2>/dev/null | sort | head -1)
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "sdkmanager: $SDKM"
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 没有配置 Secrets 时自动回退 debug 签名，不会失败
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，release 将回退为 debug 签名"
            exit 0
          fi
          mkdir -p client-android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > client-android/keystore/release.jks
          printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
            > client-android/keystore.properties
          echo "已写入 release 签名配置（alias=${KEY_ALIAS}）"

      - name: Build (${{ matrix.variant }})
        working-directory: client-android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace ${{ matrix.task }}

      - name: Collect APK
        run: |
          mkdir -p dist
          find client-android/app/build/outputs/apk/${{ matrix.variant }} -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist

      - name: Verify APK signature
        if: matrix.variant == 'release'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          echo "using $APKSIGNER"
          for f in dist/*.apk; do
            echo "--- $f"
            "$APKSIGNER" verify --print-certs "$f" | grep -E "^Signer #1 certificate (DN|SHA-256)"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nastv-apk-${{ matrix.variant }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: rm -f client-android/keystore.properties client-android/keystore/release.jks

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: nastv-apk-release
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh dist
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
                 --title "NasTV $TAG" \
                 --notes "Android APK，按 ABI 分包：arm64-v8a（主流手机）/ armeabi-v7a（旧设备）/ x86_64（模拟器）。所有版本由同一密钥签名，可直接覆盖升级。"
          gh release upload "$TAG" dist/*.apk -R "$GITHUB_REPOSITORY" --clobber
